def render_banner(titre, sous_titre, kicker="BANK OF AFRICA"):
    """Affiche le bandeau d'en-tête institutionnel en haut de l'application."""
    import streamlit as st
    st.markdown(f"""
    <div class="platform-banner">
        <div class="platform-kicker">{kicker}</div>
        <div class="platform-title">{titre}</div>
        <div class="platform-subtitle">{sous_titre}</div>
        <hr class="platform-divider">
    </div>
    """, unsafe_allow_html=True)


def render_section_header(numero, titre, caption=None):
    """Affiche un en-tête de section avec badge numéroté, cohérent avec le
    thème de la plateforme (remplace st.header)."""
    import streamlit as st
    st.markdown(f"""
    <div class="section-header">
        <div class="section-badge">{numero}</div>
        <p class="section-title">{titre}</p>
    </div>
    """, unsafe_allow_html=True)
    if caption:
        st.markdown(f'<p class="section-caption">{caption}</p>', unsafe_allow_html=True)


def render_divider():
    import streamlit as st
    st.markdown('<hr class="section-divider">', unsafe_allow_html=True)