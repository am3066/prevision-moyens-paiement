import matplotlib.pyplot as plt

# ==============================================================================
# PALETTE DE COULEURS — PLATEFORME INSTITUTIONNELLE (Dashboard sombre)
# ==============================================================================
COLOR_NAVY_BG = "#0A192F"       # fond général de l'application
COLOR_CARD_BG = "#112240"       # fond des cartes / panneaux
COLOR_BORDER = "#1D2D50"        # bordures des cartes, séparateurs
COLOR_GOLD = "#C59B27"          # accent principal (boutons, badges, liens actifs)
COLOR_GOLD_MUTED = "#8C6239"    # variante bronze, pour les éléments secondaires
COLOR_BLUE_ACCENT = "#64FFDA"   # accent secondaire (indicateurs positifs, prévision Emis)
COLOR_TEXT = "#E6F1FF"          # texte principal sur fond sombre
COLOR_SUBTEXT = "#8892B0"       # texte secondaire / légendes / labels

# ------------------------------------------------------------------------------
# Couleurs dédiées aux graphiques (Plotly) — trajectoires Emis / Reçus
# ------------------------------------------------------------------------------
COLOR_EMIS_HIST = "#4A90E2"
COLOR_EMIS_PREV = "#64FFDA"
COLOR_RECUS_HIST = "#8C6239"
COLOR_RECUS_PREV = "#C59B27"

# ------------------------------------------------------------------------------
# Couleurs pour les graphiques matplotlib EXPORTÉS DANS LE RAPPORT WORD.
# Volontairement CLAIRES (fond blanc/gris très pâle) : un graphique au fond
# marine intégré dans un document Word destiné à être imprimé ou lu en noir et
# blanc serait illisible. Le thème sombre reste réservé à l'app, pas au rapport.
# ------------------------------------------------------------------------------
COLOR_LIGHT_BG = "#F7F9FB"
COLOR_NAVY = "#0A2540"          # bleu marine "print-friendly", plus profond que sur écran

# ------------------------------------------------------------------------------
# Tokens de mise en page
# ------------------------------------------------------------------------------
RADIUS_CARD = "10px"
FONT_STACK = "'Segoe UI', 'Inter', 'Calibri', sans-serif"


def appliquer_theme_graphique():
    """Configuration matplotlib pour les graphiques exportés dans le rapport
    Word (fond clair, indépendant du thème sombre de l'application)."""
    plt.rcParams.update({
        "font.family": "sans-serif",
        "font.sans-serif": ["Segoe UI", "Calibri", "Arial"],
        "axes.facecolor": COLOR_LIGHT_BG,
        "figure.facecolor": "#FFFFFF",
        "axes.edgecolor": COLOR_BORDER,
        "axes.linewidth": 0.8,
        "axes.grid": True,
        "grid.color": "#EDEDED",
        "grid.linestyle": "-",
        "grid.linewidth": 0.7,
        "font.size": 9.5,
        "axes.titlesize": 11,
        "axes.titleweight": "bold",
        "axes.titlecolor": COLOR_NAVY,
        "axes.labelsize": 9.5,
        "axes.labelcolor": "#2A2A2A",
        "xtick.color": "#4A4A4A",
        "ytick.color": "#4A4A4A",
        "legend.fontsize": 9,
        "legend.frameon": True,
        "legend.facecolor": "#FFFFFF",
        "legend.edgecolor": COLOR_BORDER,
    })


